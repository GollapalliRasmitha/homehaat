<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeHaat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: gradient hero with a floating white card, white content cards on a pale lilac page */
:root{
  --ink:#0E0E2C; --muted:#55557A; --line:#ECE9F7; --page:#F5F3FF; --card:#FFFFFF;
  --black:#0B0B14; --black-2:#26263A; --pink:#E2246A; --violet:#6D4AE8;
  --ok-bg:#E3F6EC; --ok:#1C6B43;
  --display:'Sora', 'Segoe UI', system-ui, sans-serif;
  --body:'Manrope', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.demo-bar{background:var(--black);color:#fff;font-size:13px;text-align:center;padding:8px 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;border:0;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-black{background:var(--black);color:#fff}.btn-black:hover{background:var(--black-2)}
.btn-white{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-white:hover{background:var(--page)}
.btn-lg{height:56px;padding:0 28px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.arrow{width:20px;height:20px;border-radius:999px;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;text-decoration:none}
.count{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.count.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}

/* header */
.top{background:linear-gradient(180deg,#3F7BE6 0%,#6F95EE 34%,#A9AEF2 68%,#E6D3F8 100%);padding-block:18px}
.top.slim{padding-block:14px;background:linear-gradient(90deg,#3F7BE6,#8A9DF0 60%,#D9C6F6)}
.nav{background:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;box-shadow:0 10px 30px rgba(30,40,120,.18)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#FF6FA8,#7B5CF0);display:flex;align-items:center;justify-content:center}
.logo-word{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.5px}
.links{flex:1 1 320px;display:flex;flex-wrap:wrap;gap:2px}
.links a{padding:10px 13px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none}
.links a.on{background:var(--page)}
.actions{display:flex;gap:6px;align-items:center}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding-top:64px;padding-bottom:48px}
.hero-card{flex:1 1 400px;max-width:470px;min-width:0;background:#fff;border-radius:28px;padding:34px;box-shadow:0 30px 60px rgba(30,40,120,.2);display:flex;flex-direction:column;gap:18px}
.hero-card h1{font-weight:600;font-size:clamp(34px,5vw,44px);line-height:1.05;letter-spacing:-1.6px}
.hero-card p{margin:8px 0 0;color:var(--muted);font-size:15px}
.field-label{font-size:14px;font-weight:700;display:block;margin-bottom:8px}
.big-field{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.big-field select,.big-field input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-family:var(--display);font-size:18px;font-weight:600;outline:none}
.bubble{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.hero-art{flex:1 1 440px;min-width:0;position:relative;height:500px}
.float{animation:float 6s ease-in-out infinite}
.f2{animation-duration:7s;animation-delay:-2s}.f3{animation-duration:8s;animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.chip-float{position:absolute;background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(30,40,120,.16)}

/* sections */
section.block{padding-block:56px 8px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px}
.head h2{font-weight:600;font-size:clamp(26px,3.4vw,36px);letter-spacing:-1.1px}
.head a{font-weight:700;font-size:15px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cats{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.cat{border-radius:26px;padding:18px;height:180px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;transition:transform .25s,box-shadow .25s}
.cat span{font-family:var(--display);font-weight:600;font-size:17px}
.cat svg{align-self:flex-end}
.lift{transition:transform .25s,box-shadow .25s}
.lift:hover,.cat:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(46,38,120,.15)}

/* product card */
.pcard{position:relative;background:#fff;border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px rgba(46,38,120,.06)}
.pimg{position:relative;aspect-ratio:1;border-radius:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;overflow:hidden}
.pimg svg{width:56%;height:auto;transition:transform .4s}
.pcard:hover .pimg svg{transform:scale(1.06) rotate(-2deg)}
.tag{position:absolute;left:12px;top:12px;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.tag.dark{background:var(--black);color:#fff}
.heart{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:999px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px rgba(46,38,120,.14);transition:transform .2s}
.heart:active{transform:scale(1.25)}
.pbody{padding:0 6px 6px;display:flex;flex-direction:column;gap:3px}
.maker-link{font-size:13px;font-weight:700;color:var(--violet);text-decoration:none}
.pname{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.3;text-decoration:none}
.meta{font-size:14px;color:var(--muted)}
.prow{margin-top:10px;display:flex;align-items:center;justify-content:space-between}
.price{font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.plus{width:46px;height:46px;border-radius:999px;border:0;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.plus:hover{background:var(--black-2)}.plus[disabled]{opacity:.35;cursor:not-allowed}

/* makers */
.mcard{background:#fff;border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;text-decoration:none;box-shadow:0 6px 20px rgba(46,38,120,.06)}
.mono{width:58px;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;flex:none}

/* promo */
.promo{border-radius:36px;background:linear-gradient(120deg,#4B2BC9 0%,#7A3FD6 50%,#C2387F 100%);padding:48px;display:flex;flex-wrap:wrap;align-items:center;gap:28px;color:#fff;margin-top:56px}
.promo h2{font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.06;letter-spacing:-1.3px}
.pill-light{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}

/* generic page */
.page{padding-block:40px 72px}
.title{font-weight:600;font-size:clamp(30px,4.5vw,44px);letter-spacing:-1.4px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted)}
.panel{background:#fff;border-radius:26px;padding:24px;box-shadow:0 6px 20px rgba(46,38,120,.06)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 26px}
.chip{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--black);color:#fff;border-color:var(--black)}
.select{height:42px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:600;font-size:14px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:999px;background:#fff;border:1px solid var(--line);flex:1 1 280px;min-width:0}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15px}
.empty{text-align:center;padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{margin:0;color:var(--muted)}

/* store */
.cover{border-radius:30px;height:240px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.store-head{margin:-60px 24px 0;position:relative;background:#fff;border-radius:28px;padding:24px;display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;box-shadow:0 20px 40px rgba(46,38,120,.12)}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin:6px 0 0;padding:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:13px;color:var(--muted)}.facts dd{margin:0;font-weight:700}

/* product page */
.pdp{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.pdp-img{flex:1 1 440px;min-width:0;aspect-ratio:1;border-radius:30px;display:flex;align-items:center;justify-content:center;max-width:100%}
.pdp-img svg{width:58%}
.pdp-info{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;height:46px}
.stepper button{width:46px;height:44px;border:0;background:transparent;border-radius:999px;cursor:pointer;font-size:20px;font-weight:600}
.stepper button:hover{background:var(--page)}
.stepper span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
textarea,.input{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;font-size:15px;outline:none}
textarea:focus,.input:focus{border-color:var(--violet)}
.input{height:48px}
.rows{border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.rows dt{color:var(--muted)}.rows dd{margin:0;font-weight:600;text-align:right}

/* bag */
.bag{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.bag-list{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.summary{flex:1 1 300px;min-width:0;position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.group-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.thumb{width:84px;height:84px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.thumb svg{width:60%}
.sum-row{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.total b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.note-box{background:var(--page);border-radius:14px;padding:12px 14px;font-size:14px}
.linkish{border:0;background:none;padding:8px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* checkout */
.steps{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 26px}
.step{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.step i{font-style:normal;width:28px;height:28px;border-radius:999px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff}
.step.on{color:var(--ink)}.step.on i{background:var(--black);color:#fff;border-color:var(--black)}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.err{color:#B42318;font-size:13px;margin-top:4px}
.testpill{display:inline-block;background:#FFF1C2;color:#6B4A00;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.spinner{width:44px;height:44px;border-radius:999px;border:4px solid var(--line);border-top-color:var(--violet);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* status */
.status{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700}
.st-new{background:#FFE9F2;color:#9A1550}.st-preparing{background:#EEE8FF;color:#4B2BC9}
.st-out{background:#E3EDFF;color:#1F4FB8}.st-delivered{background:var(--ok-bg);color:var(--ok)}.st-cancelled{background:#F1F1F4;color:#55557A}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}
.tl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.tl b{height:6px;border-radius:999px;background:var(--line)}
.tl.done{color:var(--ink);font-weight:700}.tl.done b{background:linear-gradient(90deg,#7B5CF0,#E2246A)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:50}

/* footer */
footer{padding-block:48px 28px;margin-top:64px;background:linear-gradient(180deg,var(--page),#E6D3F8)}
.foot{border-top:1px solid #DCD3F2;padding-top:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.foot nav{display:flex;flex-wrap:wrap;gap:22px;font-weight:600;font-size:14px}
.foot nav a{color:var(--muted);text-decoration:none}

@media (max-width:640px){
  .hero-art{height:340px}
  .promo{padding:30px}
  .store-head{margin:-40px 8px 0}
  .form-grid{grid-template-columns:1fr}
  .links{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function groups(){
  const g = {};
  for(const [id, q] of Object.entries(bag)){ const p = product(id); if(!p) continue; (g[p.seller] = g[p.seller] || []).push({p, q}); }
  return Object.entries(g).map(([sid, lines]) => { const s = seller(sid); const items = lines.reduce((a,l)=>a+l.p.price*l.q,0); return {s, lines, items, fee:s.fee, sub:items+s.fee}; });
}
function totals(gs){ const items = gs.reduce((a,g)=>a+g.items,0), fees = gs.reduce((a,g)=>a+g.fee,0); return {items, fees, grand:items+fees, count:bagCount()}; }

/* ---------- router ---------- */
function render(){
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/');
  const [r, a] = parts;
  const view = {'':home, explore:()=>explore(a), makers, store:()=>store(a), p:()=>pdp(a), bag:bagPage, checkout, success:()=>success(Number(a)), orders:ordersPage, order:()=>orderPage(Number(a)), custom:()=>custom(a), wishlist}[r] || notFound;
  $('#app').innerHTML = view();
}
let lastBase = '';
window.addEventListener('hashchange', () => {
  const base = (location.hash.replace(/^#\/?/, '').split('/')[0]) || '';
  if(!location.hash.startsWith('#/checkout')){ ui.step = 1; ui.paying = false; }
  ui.qty = 1; render();
  if(base !== lastBase || base !== 'explore') window.scrollTo(0,0);
  lastBase = base;
});

/* ---------- actions ---------- */
function addToBag(id, q){
  const p = product(id); if(!p || p.stock===0) return;
  const cur = bag[id] || 0;
  if(!p.custom && cur + q > p.stock){ toast(`Only ${p.stock} available`); return; }
  bag[id] = cur + q; persist(); render(); bump(); toast(`Added to bag: ${p.name}`);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-toast]'); if(!t) return;
  const d = t.dataset;
  if(d.add){ addToBag(d.add, 1); }
  else if(d.addqty){ addToBag(d.addqty, ui.qty); }
  else if(d.wish){ const id = Number(d.wish); wish = wish.includes(id) ? wish.filter(x=>x!==id) : [...wish, id]; persist(); render(); toast(wish.includes(id)?'Saved to wishlist':'Removed from wishlist'); }
  else if(d.qty){ const p = product(location.hash.split('/')[2]); ui.qty = Math.max(1, Math.min(p ? Math.max(p.stock,1) : 50, ui.qty + Number(d.qty))); render(); }
  else if(d.bagqty){ const id = d.bagqty, p = product(id), n = (bag[id]||0) + Number(d.d);
    if(n < 1){ delete bag[id]; toast('Removed from bag'); } else if(!p.custom && n > p.stock){ toast(`Only ${p.stock} available`); return; } else bag[id] = n;
    persist(); render(); }
  else if(d.remove){ delete bag[d.remove]; persist(); render(); toast('Removed from bag'); }
  else if('cat' in d){ location.hash = d.cat==='all' ? '#/explore' : '#/explore/'+d.cat; }
  else if('instock' in d){ ui.inStock = !ui.inStock; render(); }
  else if('clear' in d){ ui.q=''; ui.inStock=false; if(location.hash==='#/explore') render(); else location.hash = '#/explore'; }
  else if(d.step){ ui.step = Number(d.step); render(); window.scrollTo(0,0); }
  else if('pay' in d){
    ui.paying = true; render();
    setTimeout(() => {
      const gs = groups(), t = totals(gs), id = 1000 + orders.length + 1;
      orders.push({id, at:Date.now(), grand:t.grand, parts:gs.map(g=>({seller:g.s.id, fee:g.fee, status:'new', lines:g.lines.map(({p,q})=>({name:p.name, price:p.price, q}))}))});
      bag = {}; ui.paying = false; ui.step = 1; persist(); location.hash = '#/success/'+id;
    }, 1600);
  }
  else if(d.advance){ const [oid, i] = d.advance.split(':').map(Number); const part = orders.find(o=>o.id===oid).parts[i];
    part.status = STATUS[Math.min(STATUS.indexOf(part.status)+1, 3)]; persist(); render(); toast(`${seller(part.seller).name}: ${STATUS_LABEL[part.status]}`); }
  else if(d.quote){ const r = requests.find(x=>x.id===Number(d.quote)); r.status='quoted'; r.quote = r.budget ? r.budget*100 : 140000; persist(); render(); toast('The maker sent a quote'); }
  else if(d.accept){ const r = requests.find(x=>x.id===Number(d.accept)); r.status='accepted'; bag['c'+r.id] = 1; persist(); render(); bump(); toast('Custom order added to your bag'); }
  else if(d.decline){ const r = requests.find(x=>x.id===Number(d.decline)); r.status='declined'; persist(); render(); toast('Quote declined'); }
  else if(d.copy){ const txt = d.copy; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Shop link copied'), ()=>toast('Link: '+txt)); }
  else if(d.toast){ toast(d.toast); }
});
document.addEventListener('change', (e) => {
  if(e.target.id === 'sort'){ ui.sort = e.target.value; render(); }
  if(e.target.matches('[data-addr]')){ ui.addr = Number(e.target.value); render(); }
});
document.addEventListener('input', (e) => {
  if(e.target.id === 'q'){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos,pos); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if(e.target.id === 'finder'){ const c = $('#f-cat').value; location.hash = c==='all' ? '#/explore' : '#/explore/'+c; }
  if(e.target.id === 'addrform'){
    const pin = $('#a-pin').value.trim(), ok = /^\d{6}$/.test(pin);
    $('#pin-err').hidden = ok; if(!ok) return;
    if(!$('#a-name').value.trim() || !$('#a-line').value.trim()){ toast('Please fill in name and address'); return; }
    addresses.push({name:$('#a-name').value.trim(), phone:$('#a-phone').value.trim(), line1:$('#a-line').value.trim(), city:$('#a-city').value.trim(), pin});
    ui.addr = addresses.length-1; persist(); render(); toast('Address saved');
  }
  if(e.target.id === 'reqform'){
    const desc = $('#r-desc').value.trim(); $('#r-err').hidden = !!desc; if(!desc) return;
    const budget = Number($('#r-budget').value) || 0;
    requests.push({id:Date.now(), seller:$('#r-seller').value, desc, budget, status:'open'}); persist(); render(); toast('Request sent to the maker');
  }
});
render();
</script>
</body>
</html>
