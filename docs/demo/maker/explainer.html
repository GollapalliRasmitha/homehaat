<!doctype html>
<meta charset="utf-8">
<title>HomeHaat explainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>body{margin:0;background:#111}canvas{width:960px;height:540px}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="mp4.js"></script>
<script>
// HomeHaat explainer: the same structure, timing and look as Oppora-explainer.mp4 (dark glowing background, eyebrow +
// headline with one accent, cards that appear one by one, counters, end card), in HomeHaat's warm tones and fonts.
const W = 1920, H = 1080, FPS = 30, T = 60;
const c = document.getElementById("c"), g = c.getContext("2d");
const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3));
const appear = (lt, at, d = 0.6) => ease((lt - at) / d);
const WHITE = "#FFFFFF", MUTE = "rgba(255,255,255,0.62)", FAINT = "rgba(255,255,255,0.42)";
const ACC1 = "#F6C9A0", ACC2 = "#F08A6C"; // warm apricot -> terracotta
let cupcake;

// ---------- background: dark warm base with three slowly drifting glows ----------
function bg(t) {
  g.fillStyle = "#14100D"; g.fillRect(0, 0, W, H);
  const blobs = [
    [0.22 + 0.05 * Math.sin(t * 0.21), 0.18 + 0.04 * Math.cos(t * 0.17), 760, "rgba(150,72,46,0.55)"],
    [0.82 + 0.04 * Math.cos(t * 0.19), 0.72 + 0.05 * Math.sin(t * 0.23), 820, "rgba(166,112,52,0.42)"],
    [0.55 + 0.06 * Math.sin(t * 0.13 + 1), 0.95 + 0.03 * Math.cos(t * 0.29), 640, "rgba(128,48,64,0.45)"],
  ];
  for (const [x, y, r, col] of blobs) {
    const gr = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, r);
    gr.addColorStop(0, col); gr.addColorStop(1, "rgba(20,16,13,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function card(x, y, w, h, a, r = 18) {
  g.save(); g.globalAlpha = a; rr(x, y, w, h, r);
  g.fillStyle = "rgba(255,255,255,0.065)"; g.fill(); g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 1.5; g.stroke(); g.restore();
}
function text(s, x, y, { size = 24, weight = 500, color = WHITE, align = "left", font = "Inter Tight", italic = false, alpha = 1, spacing = 0 } = {}) {
  g.save(); g.globalAlpha *= alpha; g.font = `${italic ? "italic " : ""}${weight} ${size}px '${font}'`; g.letterSpacing = spacing + "px";
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "alphabetic"; g.fillText(s, x, y); const w = g.measureText(s).width; g.restore(); return w;
}
function accentFill(x0, x1) { const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, ACC1); gr.addColorStop(1, ACC2); return gr; }
/** Eyebrow + headline "before ACCENT after", centred at y, like Oppora's scene titles. */
function title(lt, eyebrow, before, accent, after, y = 210, out = 1) {
  const a = appear(lt, 0, 0.8) * out;
  text(eyebrow.toUpperCase(), W / 2, y - 62, { size: 18, weight: 700, color: ACC1, align: "center", alpha: a, spacing: 4 });
  g.save(); g.globalAlpha = a;
  const size = 68, dy = (1 - appear(lt, 0, 0.8)) * 16;
  g.font = `700 ${size}px 'Inter Tight'`; g.letterSpacing = "-1.5px";
  const wb = g.measureText(before).width, wa_ = (g.font = `italic 400 ${size * 1.12}px 'Instrument Serif'`, g.letterSpacing = "0px", g.measureText(accent).width);
  g.font = `700 ${size}px 'Inter Tight'`; g.letterSpacing = "-1.5px";
  const wf = g.measureText(after).width, x0 = W / 2 - (wb + wa_ + wf) / 2;
  g.fillStyle = WHITE; g.fillText(before, x0, y + dy);
  g.font = `italic 400 ${size * 1.12}px 'Instrument Serif'`; g.letterSpacing = "0px"; g.fillStyle = accentFill(x0 + wb, x0 + wb + wa_); g.fillText(accent, x0 + wb, y + dy);
  g.font = `700 ${size}px 'Inter Tight'`; g.letterSpacing = "-1.5px"; g.fillStyle = WHITE; g.fillText(after, x0 + wb + wa_, y + dy);
  g.restore();
}
function logo(cx, cy, size, a) {
  g.save(); g.globalAlpha = a;
  g.font = `800 ${size}px 'Inter Tight'`; g.letterSpacing = `${-size * 0.045}px`;
  const w = g.measureText("homehaat").width, tile = size * 1.05, gap = size * 0.28, x0 = cx - (tile + gap + w) / 2;
  rr(x0, cy - tile * 0.78, tile, tile, tile * 0.28); g.fillStyle = accentFill(x0, x0 + tile); g.fill();
  g.fillStyle = "#14100D"; g.font = `italic 400 ${tile * 0.9}px 'Instrument Serif'`; g.letterSpacing = "0px"; g.textAlign = "center";
  g.fillText("h", x0 + tile / 2, cy - tile * 0.78 + tile * 0.76);
  g.textAlign = "left"; g.font = `800 ${size}px 'Inter Tight'`; g.letterSpacing = `${-size * 0.045}px`; g.fillStyle = WHITE; g.fillText("homehaat", x0 + tile + gap, cy);
  g.restore();
}
function chip(x, y, label, col, a) {
  g.save(); g.globalAlpha = a; g.font = "700 16px 'Inter Tight'"; const w = g.measureText(label).width + 26;
  rr(x, y - 22, w, 32, 16); g.fillStyle = col; g.fill(); g.fillStyle = "#14100D"; g.fillText(label, x + 13, y); g.restore(); return w;
}
const count = (lt, at, to, d = 1.4) => Math.round(to * ease((lt - at) / d));

// ---------- scenes (start, end) ----------
const scenes = [
  [0, 5.5, (lt, o) => {
    logo(W / 2, 560, 120, appear(lt, 0.2, 0.9) * o);
    text("A marketplace for home businesses near you", W / 2, 660, { size: 30, color: MUTE, align: "center", alpha: appear(lt, 1.3, 0.8) * o });
  }],
  [5.5, 12.5, (lt, o) => {
    title(lt, "The problem", "Great home makers are ", "hard to find", "", 210, o);
    const rows = [
      ["Instagram DM", "“DM for price” · Lakshmi’s cakes", true],
      ["WhatsApp group", "Pickles available this week, pay on UPI", true],
      ["Neighbour’s number", "Blouse stitching, call after 6 pm", true],
      ["Flyer at the gate", "Pottery class + mugs, no photos", false],
      ["Every maker", "a separate chat, payment and delivery", false],
    ];
    rows.forEach(([who, what, hot], i) => {
      const a = appear(lt, 0.9 + i * 0.55) * o, y = 330 + i * 92, dx = (1 - a) * -24;
      card(560 + dx, y, 800, 72, a, 14);
      g.save(); g.globalAlpha = a; g.beginPath(); g.arc(592 + dx, y + 36, 6, 0, 7); g.fillStyle = hot ? ACC2 : FAINT; g.fill(); g.restore();
      text(who, 616 + dx, y + 45, { size: 23, weight: 700, alpha: a });
      text(what, 860 + dx, y + 45, { size: 23, color: MUTE, alpha: a });
    });
  }],
  [12.5, 21.5, (lt, o) => {
    title(lt, "How it works", "One bag, ", "many makers", "", 210, o);
    const steps = [["Browse", "Search and categories, real photos from home makers."], ["One bag", "Add items from different makers to one bag."],
      ["Pay once", "One Razorpay payment, split per maker on the server."], ["Each maker ships", "Every maker gets their own order and timeline."]];
    steps.forEach(([h, d], i) => {
      const a = appear(lt, 1.0 + i * 1.0) * o, x = 260 + i * 360, y = 360 + (1 - a) * 24;
      card(x, y, 330, 300, a);
      g.save(); g.globalAlpha = a; rr(x + 30, y + 30, 46, 46, 12); g.fillStyle = accentFill(x + 30, x + 76); g.fill(); g.restore();
      text(String(i + 1), x + 53, y + 63, { size: 24, weight: 800, color: "#14100D", align: "center", alpha: a });
      text(h, x + 30, y + 130, { size: 32, weight: 700, alpha: a });
      wrap(d, x + 30, y + 178, 270, 34, { size: 23, color: MUTE, alpha: a });
    });
  }],
  [21.5, 30.5, (lt, o) => {
    title(lt, "Your order", "Paid once, ", "split per maker", "", 210, o);
    const rows = [["Lakshmi’s Kitchen", "Chocolate truffle cake · ₹890", "Preparing", "#F6C9A0"],
      ["Clay & Kiln", "Set of 2 coffee mugs · ₹1,170", "Out for delivery", "#C9D6A6"],
      ["Amma’s Pickles", "Mango pickle · ₹270", "Refund started", "#E9A99A"]];
    rows.forEach(([shop, what, st, col], i) => {
      const a = appear(lt, 1.0 + i * 0.7) * o, y = 330 + i * 120, dx = (1 - a) * -24;
      card(330 + dx, y, 820, 98, a, 16);
      text(shop, 370 + dx, y + 44, { size: 26, weight: 700, alpha: a });
      text(what, 370 + dx, y + 78, { size: 21, color: MUTE, alpha: a });
      g.save(); g.font = "700 16px 'Inter Tight'"; const w = g.measureText(st).width + 26; g.restore();
      chip(1110 - w + dx, y + 58, st, col, a);
    });
    const s1 = appear(lt, 2.6) * o, s2 = appear(lt, 3.4) * o;
    card(1190, 330, 400, 158, s1); text("₹" + count(lt, 2.6, 2330).toLocaleString("en-IN"), 1230, 425, { size: 64, weight: 800, alpha: s1, spacing: -2 });
    text("paid in one payment", 1232, 466, { size: 21, color: MUTE, alpha: s1 });
    card(1190, 512, 400, 158, s2); text(String(count(lt, 3.4, 3, 0.8)), 1230, 607, { size: 64, weight: 800, alpha: s2 });
    text("maker orders, one each", 1232, 648, { size: 21, color: MUTE, alpha: s2 });
  }],
  [30.5, 37.5, (lt, o) => {
    title(lt, "Fair refunds", "Cancel one maker, ", "refund just that part", "", 210, o);
    const a = appear(lt, 1.0) * o, y = 360 + (1 - a) * 20;
    card(560, y, 800, 250, a);
    g.save(); g.globalAlpha = a; rr(600, y + 40, 52, 52, 14); g.fillStyle = "rgba(246,201,160,0.22)"; g.fill(); g.restore();
    text("₹", 626, y + 78, { size: 30, weight: 800, color: ACC1, align: "center", alpha: a });
    text("Refund of ₹270 started", 680, y + 76, { size: 30, weight: 700, color: ACC1, alpha: a });
    wrap("Amma’s Pickles part cancelled. The cake from Lakshmi’s Kitchen carries on.", 680, y + 120, 640, 34, { size: 23, color: MUTE, alpha: a });
    const b = appear(lt, 2.4) * o;
    g.save(); g.globalAlpha = b; rr(600, y + 180, 720, 44, 10); g.fillStyle = "rgba(0,0,0,0.28)"; g.fill(); g.restore();
    text("One refund per part, sent once: a retry never refunds twice.", 622, y + 210, { size: 20, color: MUTE, alpha: b, italic: false });
  }],
  [37.5, 45.5, (lt, o) => {
    title(lt, "AI listing helper", "AI writes the listing, ", "you check it", "", 210, o);
    const a = appear(lt, 0.9) * o, y = 340 + (1 - a) * 20;
    card(430, y, 330, 330, a);
    if (cupcake) { g.save(); g.globalAlpha = a; rr(450, y + 20, 290, 290, 14); g.clip(); g.drawImage(cupcake, 450, y + 20, 290, 290); g.restore(); }
    const b = appear(lt, 2.0) * o;
    card(800, y, 690, 330, b);
    text("✨  SUGGESTION", 840, y + 52, { size: 17, weight: 700, color: ACC1, alpha: b, spacing: 3 });
    text("Cupcakes with white swirls", 840, y + 104, { size: 36, weight: 700, alpha: b });
    wrap("These small baked treats feature generous white frosting swirls on top, each in a paper liner.", 840, y + 150, 610, 34, { size: 23, color: MUTE, alpha: b });
    const k = appear(lt, 3.3) * o;
    let x = 840; for (const s of ["no invented prices", "no guessed ingredients", "seller edits first"]) x += chip(x, y + 282, s, "rgba(246,201,160,0.9)", k) + 12;
  }],
  [45.5, 52.5, (lt, o) => {
    title(lt, "Under the hood", "A real ", "full-stack", " build", 210, o);
    const tech = [["Next.js", "TypeScript · Tailwind"], ["Django REST", "Python API"], ["PostgreSQL", "Neon · full-text search"], ["Razorpay", "Test mode · webhooks · refunds"],
      ["Cloudinary", "Photos · private uploads"], ["Gemini AI", "Listing helper"], ["Vercel + Render", "Free-tier deploy"], ["Claude Code", "AI-assisted development"]];
    tech.forEach(([h, d], i) => {
      const a = appear(lt, 0.8 + i * 0.32) * o, col = i % 4, row = Math.floor(i / 4), x = 300 + col * 340, y = 340 + row * 160 + (1 - a) * 18;
      card(x, y, 310, 130, a, 16);
      text(h, x + 28, y + 58, { size: 27, weight: 700, alpha: a });
      text(d, x + 28, y + 94, { size: 19, color: MUTE, alpha: a });
    });
  }],
  [52.5, 60, (lt, o) => {
    const stats = [[count(lt, 0.3, 370), "~", "automated tests"], [count(lt, 0.5, 8, 1), "", "makers in the demo"], [0, "₹", "hosting cost"]];
    stats.forEach(([n, pre, l], i) => {
      const a = appear(lt, 0.2 + i * 0.25) * o, x = 590 + i * 260, y = 260;
      card(x, y, 230, 150, a, 18);
      g.save(); g.globalAlpha = a; g.font = "800 58px 'Inter Tight'"; g.letterSpacing = "-2px"; g.textAlign = "center";
      g.fillStyle = accentFill(x + 40, x + 190); g.fillText(pre + n, x + 115, y + 82); g.restore();
      text(l, x + 115, y + 120, { size: 19, color: MUTE, align: "center", alpha: a });
    });
    logo(W / 2, 600, 76, appear(lt, 1.6) * o);
    const p = appear(lt, 2.4) * o;
    g.save(); g.globalAlpha = p; g.font = "700 30px 'Inter Tight'"; const w = g.measureText("homehaat.vercel.app").width + 70;
    rr(W / 2 - w / 2, 660, w, 64, 32); g.fillStyle = "rgba(255,255,255,0.12)"; g.fill(); g.restore();
    text("homehaat.vercel.app", W / 2, 703, { size: 30, weight: 700, align: "center", alpha: p });
    text("github.com/GollapalliRasmitha/homehaat", W / 2, 775, { size: 22, color: MUTE, align: "center", alpha: appear(lt, 2.9) * o });
    text("Built by Rasmitha Gollapalli", W / 2, 825, { size: 22, color: FAINT, align: "center", alpha: appear(lt, 3.3) * o });
  }],
];
function wrap(s, x, y, maxW, lh, opts) {
  g.save(); g.font = `${opts.weight || 500} ${opts.size}px 'Inter Tight'`;
  const words = s.split(" "); let line = "", yy = y;
  for (const wd of words) { const test = line ? line + " " + wd : wd; if (g.measureText(test).width > maxW && line) { text(line, x, yy, opts); line = wd; yy += lh; } else line = test; }
  if (line) text(line, x, yy, opts); g.restore();
}
function drawAt(t) {
  bg(t);
  for (const [s, e, fn] of scenes) {
    if (t >= s && t < e) { const lt = t - s, out = e === T ? 1 - ease((t - (T - 0.8)) / 0.8) : 1 - ease((lt - (e - s - 0.5)) / 0.5); fn(lt, out); }
  }
}

// ---------- music (the same original gentle loop as the walkthrough) ----------
async function music(seconds) {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(seconds * sr), sr);
  const master = ctx.createGain(); master.gain.setValueAtTime(0.0001, 0); master.gain.exponentialRampToValueAtTime(0.5, 2.5);
  master.gain.setValueAtTime(0.5, seconds - 3.5); master.gain.exponentialRampToValueAtTime(0.0001, seconds - 0.2);
  const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  const delay = ctx.createDelay(1); delay.delayTime.value = 0.375; const fb = ctx.createGain(); fb.gain.value = 0.28;
  const wet = ctx.createGain(); wet.gain.value = 0.35; delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  const bpm = 96, beat = 60 / bpm, bar = beat * 4, hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const chords = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62]];
  const pad = (t, notes, len) => notes.forEach((m) => [0, 0.07].forEach((det) => {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), v = ctx.createGain();
    o.type = "triangle"; o.frequency.value = hz(m) * (1 + det / 100); f.type = "lowpass"; f.frequency.value = 1400;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.045, t + 0.9); v.gain.setValueAtTime(0.045, t + len - 0.6); v.gain.linearRampToValueAtTime(0, t + len + 0.4);
    o.connect(f); f.connect(v); v.connect(master); o.start(t); o.stop(t + len + 0.5);
  }));
  const pluck = (t, m, vel) => { const o = ctx.createOscillator(), v = ctx.createGain(); o.type = "sine"; o.frequency.value = hz(m);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vel, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0008, t + 0.9);
    o.connect(v); v.connect(master); v.connect(delay); o.start(t); o.stop(t + 1); };
  const bass = (t, m, len) => { const o = ctx.createOscillator(), v = ctx.createGain(); o.type = "sine"; o.frequency.value = hz(m - 12);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(0.12, t + 0.05); v.gain.exponentialRampToValueAtTime(0.01, t + len);
    o.connect(v); v.connect(master); o.start(t); o.stop(t + len); };
  const pattern = [0, 2, 1, 3, 2, 1, 3, 2];
  for (let b = 0, t = 0; t < seconds; b++, t += bar) {
    const ch = chords[b % 4]; pad(t, ch, bar); bass(t, ch[0], beat * 1.8); bass(t + beat * 2, ch[0], beat * 1.8);
    if (t > bar * 2 - 0.01) for (let s = 0; s < 8; s++) pluck(t + s * beat / 2, ch[pattern[s]] + 12, s % 2 ? 0.05 : 0.08);
  }
  return ctx.startRendering();
}

async function load() {
  cupcake = await new Promise((r) => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = "cupcake.jpg"; });
  await document.fonts.load("700 60px 'Inter Tight'"); await document.fonts.load("800 60px 'Inter Tight'"); await document.fonts.load("italic 60px 'Instrument Serif'"); await document.fonts.ready;
}
async function render(onProgress) {
  const frames = T * FPS, vSamples = []; let avcC = null;
  const ve = new VideoEncoder({ output: (ch, meta) => { if (meta?.decoderConfig?.description) avcC = new Uint8Array(meta.decoderConfig.description); const d = new Uint8Array(ch.byteLength); ch.copyTo(d); vSamples.push({ data: d, key: ch.type === "key" }); }, error: (e) => { throw e; } });
  ve.configure({ codec: "avc1.640028", width: W, height: H, bitrate: 1_700_000, bitrateMode: "variable", framerate: FPS, avc: { format: "avc" } });
  for (let f = 0; f < frames; f++) {
    drawAt(f / FPS);
    const vf = new VideoFrame(c, { timestamp: Math.round((f * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(vf, { keyFrame: f % (FPS * 2) === 0 }); vf.close();
    while (ve.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (f % 4 === 0) await new Promise((r) => setTimeout(r, 0));
    if (f % 60 === 0) onProgress(f / frames);
  }
  await ve.flush(); ve.close();
  const buf = await music(T), aSamples = []; let asc = null;
  const ae = new AudioEncoder({ output: (ch, meta) => { if (meta?.decoderConfig?.description) asc = new Uint8Array(meta.decoderConfig.description); const d = new Uint8Array(ch.byteLength); ch.copyTo(d); aSamples.push({ data: d }); }, error: (e) => { throw e; } });
  ae.configure({ codec: "mp4a.40.2", sampleRate: 44100, numberOfChannels: 2, bitrate: 128000 });
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  for (let i = 0; i < L.length; i += 4410) {
    const n = Math.min(4410, L.length - i), pl = new Float32Array(n * 2); pl.set(L.subarray(i, i + n), 0); pl.set(R.subarray(i, i + n), n);
    const ad = new AudioData({ format: "f32-planar", sampleRate: 44100, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i * 1e6) / 44100), data: pl });
    ae.encode(ad); ad.close();
  }
  await ae.flush(); ae.close();
  return writeMp4({ width: W, height: H, timescale: 90000, frameTicks: 3000, avcC, samples: vSamples },
    { sampleRate: 44100, channels: 2, asc: asc || new Uint8Array([0x12, 0x10]), bitrate: 128000, samples: aSamples });
}
window.makeVideo = async () => {
  await load();
  const mp4 = await render((p) => (document.title = "rendering " + Math.round(p * 100) + "%"));
  await fetch("/out/video", { method: "POST", body: mp4 });
  drawAt(26); await fetch("/out/poster", { method: "POST", body: await new Promise((r) => c.toBlob(r, "image/png")) });
  return { seconds: T, bytes: mp4.length };
};
window.preview = async (t) => { if (!cupcake) await load(); drawAt(t); return c.toDataURL("image/jpeg", 0.85); };
</script>
